onboarding = false

# herdr has no config includes, so scripts/theme.sh rewrites everything
# between the markers below. Do not edit that region by hand.
#
# herdr maps Nord onto Catppuccin token names: text is nord6, subtext0 is
# nord4. overlay0 is what actually carries the sidebar, twenty uses against
# six for text. All values are the neutralized ones used elsewhere.
#
# There is no built-in nord-light, so the light side is a hand-built palette
# on top of the `terminal` base, with accents darkened to stay legible.
# >>> theme (managed)
[theme]
name = "nord"
auto_switch = false

[theme.custom]
panel_bg = "reset"
surface_dim = "reset"
text = "#F7F7F7"
subtext0 = "#E7E7E7"
overlay1 = "#6D6D6D"
overlay0 = "#555555"
# <<< theme (managed)

[terminal]
default_shell = "zsh"

[keys]
prefix = "ctrl+space"
split_vertical = "prefix+\\"
split_horizontal = "prefix+minus"

# tmux muscle memory
rename_tab = "prefix+comma"
detach = "prefix+d"
workspace_picker = ["prefix+s", "prefix+w"]
settings = "prefix+shift+s"
previous_workspace = "prefix+("
next_workspace = "prefix+)"
switch_workspace = "prefix+shift+1..9"
last_pane = ["prefix+;", "prefix+shift+l"]
help = "prefix+/"

# navigate mode: j/k through sessions, ctrl+h/j/k/l for panes
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_left = "ctrl+h"
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"
navigate_pane_right = "ctrl+l"

# cycle agent panes (prefix+o jumps to the one needing attention)
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
focus_agent = "prefix+alt+1..9"

# zoom on m like tmux, prefix+z still works too
[[keys.command]]
key = "prefix+m"
type = "shell"
command = "herdr pane zoom --current --toggle"
description = "toggle zoom (tmux-style m)"

# flip the whole setup between Nord and Nord Light (see scripts/theme.sh).
# prefix+t is free in herdr's defaults; prefix+b is toggle_sidebar, do not use it.
[[keys.command]]
key = "prefix+t"
type = "shell"
command = "~/git/dotfiles/scripts/theme.sh toggle"
description = "toggle light/dark theme"

# move the current tab, like tmux swap-window on prefix+S-Left/Right (see herdr/move-tab.sh)
[[keys.command]]
key = "prefix+shift+left"
type = "shell"
command = "~/git/dotfiles/herdr/move-tab.sh left"
description = "move tab left"

[[keys.command]]
key = "prefix+shift+right"
type = "shell"
command = "~/git/dotfiles/herdr/move-tab.sh right"
description = "move tab right"

# seamless ctrl+h/j/k/l across panes and nvim splits (see herdr/nav.sh)
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "~/git/dotfiles/herdr/nav.sh left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "~/git/dotfiles/herdr/nav.sh down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "~/git/dotfiles/herdr/nav.sh up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "~/git/dotfiles/herdr/nav.sh right"
description = "navigate right (vim/herdr)"

[advanced]
scrollback_limit_bytes = 100000000

[experimental]
pane_history = true

[ui]
# active pane border in Nord green, like the tmux active border
accent = "#A3BE8C"
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = false

[ui.toast]
delivery = "herdr"
